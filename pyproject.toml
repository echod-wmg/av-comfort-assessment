[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "avcomfort"
version = "2.0.0"
description = "Occupant comfort assessment for autonomous and conventional vehicles from IMU acceleration and jerk"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Emil Chodowiec" }]
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "pandas>=1.4", "matplotlib>=3.5"]
keywords = ["autonomous vehicles", "ride comfort", "jerk", "nuScenes", "IMU"]

[project.optional-dependencies]
maps = ["contextily>=1.3"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
avcomfort = "avcomfort.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"docs/*.py" = ["E402"]
